# Agent defaults (TDD Appendix B). Experiments override via config/experiments/*.yaml.
budgets:
  newsroom_run: {input_tokens: 80000, fetches: 5}
  cos_daily: {input_tokens: 300000, searches: 12, fetch_per_story: 3}   # 300k since 2026-11-27: one shared safety cap across all steps of a user's run (90k starved C6: docs/e2e/run1_budget90k). No single call is near a context limit
  voice_turn: {input_tokens: 30000, quick_searches: 2, quick_search_timeout_s: 3}
  followup: {input_tokens: 50000, searches: 8, fetches: 6}
  memory_reflect: {input_tokens: 20000}
clustering: {tau: 0.78, tiebreak_band: 0.08, identity_lookback_days: 7}
selection:
  k_default: 6
  k_min: 3
  k_max: 8
  seconds_per_story: 40       # K from length_s: ~4 min (240 s) -> 6 stories
  slots: {big_news: 2, for_you: 3, outside_usual: 1}
  mmr_lambda: 0.7
  min_importance_outside_usual: 50
  carryover_max: 1
  update_requires_new_facts: true
  min_beat_share: {}          # e.g. {ai: 0.67} for Kate during the self-study
packs:
  deep: {docs: 3, tokens: 2500}
  standard: {docs: 2, tokens: 1500}
  light: {docs: 1, tokens: 800}
  deep_threshold: 0.6
  light_threshold: 0.25
  max_fetch_attempts: 6       # per story: further URLs are tried when a fetch fails or is empty
  paywall_domains:            # known hard paywalls: tried last (never bypassed: no mirrors, no UA tricks)
    [wsj.com, ft.com, bloomberg.com, theinformation.com, nytimes.com, economist.com,
     asia.nikkei.com, nikkei.com, washingtonpost.com, barrons.com, reuters.com, axios.com]
  free_coverage_search: true  # digest story with no text from its URLs: one search for free coverage
                              # (thresholds: story_notes.free_coverage; charged to the user's searches)
  max_publisher_snippets: 2   # then the outlets' own headline + feed summary as attributed passages
# Per-user stored set: the brief's stories plus the next best by the C5 ranking (docs/stored-set.md).
stored_set:
  size: 20                    # stories kept per user per day; the voice agent can discuss any of them
  extra_packs: 0              # light packs for the top non-brief per-user finds (they get no shared note)
  min_shared_share: 0.5       # beyond the brief, at least half are shared stories (they have notes; D8)
memory:
  eta_explicit: 0.30
  eta_implicit: 0.15
  implicit_strength: {dive: 0.5, followup: 0.3, save_for_later: 0.4, skip: 0.2}
  half_life_implicit_d: 21
  half_life_explicit_d: 60
  max_subtopic_share: 0.35
  cut_short_opportunity: 0.3
  skip_rule: {min_sessions: 2, window: 4}
  blend_implicit: 0.3
  beta_prior: {a: 1, b: 2}    # e = (engaged + a) / (shown + a + b)
  floor: 0.05
  floor_after_days: 14
  onboarding: {weight: 0.4, confidence: 0.3}
voice:
  vad_silence_ms: 700
  max_utterance_s: 30
  auto_resume_delay_s: 1.5
  idle_end_s: 90
schedule:
  cos_lead_min: 60
# Bounded concurrency (asyncio). Performance only: results are merged in input order. 1 = sequential.
concurrency:
  headline_sources: 6         # newsroom_run: N1 source collection
  newsroom_score_batches: 4   # N5 batches in flight. >1: each batch gets a fixed share of the run's
                              # fetches and is admitted on estimated tokens; 1 = the original loop
                              # (differs only in fetch- or token-budget-limited runs)
  cos_search_queries: 6       # C2 plan queries (refinement stays sequential)
  cos_packs: 4                # C6 packs built at once
  pack_fetches: 3             # C6 fetch+extract per pack
worker:
  type_concurrency: {newsroom_run: 1}   # max jobs of a type running at once per worker (memory)
# Shared story notes (app/agents/newsroom/notes.py; docs/architecture-revisit.md part 2): one note per
# digest story after each newsroom run, shared by every user (facts cited to fetched sources).
story_notes:
  enabled: true
  max_sources_per_story: 3      # good (fetched, with text) sources per note
  max_fetch_attempts: 6         # URLs tried per story: a failed fetch moves on to the next URL
  concurrency: 6                # stories in flight at once (each fetches up to max_sources_per_story at once)
  max_text_chars: 6000          # source text per document shown to the model
  min_text_chars: 400           # less extracted text than this = failed (e.g. an unresolved redirect page)
  max_output_tokens: 2500       # a 10-fact note with quotes is ~1,200 tokens; 1,500 truncated one in the smoke run
  require_quotes: true          # each fact must carry a short quote found in a cited source, or it is dropped
  reuse_ok_hours: 6             # a story already noted "ok" this recently keeps its note (story ids are stable
                                # across runs); 0 = rewrite every story on every run
  budget: {input_tokens: 900000, output_tokens: 150000, fetches: 400}   # per run (80 stories)
  # Paywalled / blocked stories (docs/smoke/2026-11-27/paywalls): never bypassed. First, when every listed
  # source failed, ONE search for free coverage of the same event (app/agents/cos/free_coverage.py); then,
  # if still short, the publishers' own headline + feed summary as lower-grade "snippet" sources.
  free_coverage_search: true    # skipped without a search provider
  free_coverage:
    max_searches: 25            # per notes run (one digest)
    max_results: 8
    max_fetches: 2              # accepted hits fetched per story until one gives text naming the entities
    min_title_similarity: 50    # rapidfuzz, mean of token_set and token_sort ratios (0-100)
    strong_title_similarity: 80 # at or above: one matching entity is enough
    min_entities: 2             # story entities named in the hit's title + snippet (capped by how many it has)
    window_hours: 36            # hits published from (story first seen - this) until now
    allow_undated: false
  snippet_sources: true
  max_snippet_sources: 2
spend_guard: {alert_pct: [40, 60, 80], pause_eval_at_pct: 60}
# Newsroom pipeline N2-N6 (W-C; TDD §7). Additive keys, validated by app/agents/newsroom/settings.py.
newsroom:
  impl: editor                  # classic (N2-N6 below) | editor (newsroom_editor below). Overrides, highest
                                # first: experiment flag newsroom_impl, env NEWSROOM_IMPL, this key.
  window_hours: 24             # observations in (at - window, at] feed one run
  freshness_filter: true        # drop items published before the window; aggregator front pages exempt (false = pre-2026-11-26)
  max_undated_per_source: 20
  update_gap_hours: 12          # new items >= this long after a prior story's first_seen = new facts -> update_of
  score_candidates: 80          # top clusters by importance_rules sent to newsroom.score (lean rule L1)
  score_batch_size: 20
  score_max_output_tokens: 6000
  score_floor: 20               # N6: minimum importance (0-100) to enter the digest
  tiebreak_batch_size: 20
  tiebreak_max_pairs: 40        # cap on ambiguous pairs sent to newsroom.cluster_tiebreak per run
  tiebreak_max_output_tokens: 1500
  fetch_max_tokens: 800         # text returned to the model per verification fetch
  embedder: {name: fastembed, model: "BAAI/bge-small-en-v1.5"}
  primary_sources:              # source ids that are primary sources (labs, companies, agencies); arxiv always is
    ai: [openai_news, anthropic_news, deepmind_blog, meta_ai_blog, hf_blog, nvidia_blog]
    energy: [eia_today]
    physical_ai: [nvidia_blog]
  rules_weights:                # importance_rules = 100 * weighted mean of normalised features
    coverage: 0.30              # n_independent_domains (cap 8)
    frontpage: 0.20             # frontpage_hits (cap 6)
    tier: 0.15                  # best_tier: 1 -> 1.0, 2 -> 0.6, 3 -> 0.3
    rank: 0.10                  # best_rank: 1 / (1 + (rank - 1) / 5)
    hn_points: 0.10             # log-scaled, 500 points -> 1.0 (dropped when hn_signal=false)
    hn_comments: 0.05           # log-scaled, 300 comments -> 1.0 (dropped when hn_signal=false)
    velocity: 0.05              # new items since the last run (cap 5)
    primary: 0.05               # has_primary_source
# Editor newsroom (newsroom.impl: editor; app/agents/newsroom/editor.py). Shares newsroom.window_hours,
# update_gap_hours, score_floor, primary_sources, rules_weights and clustering.identity_lookback_days.
newsroom_editor:
  max_undated_per_source: 20    # undated items kept per source, by feed order (aggregator front pages keep all)
  title_dedupe_threshold: 90    # rapidfuzz token_sort_ratio on cleaned titles: >= this = same item
  max_candidates: 400           # candidates shown to the editor model, strongest signal first
  chunk_size: 400               # candidates per editor call; more -> 2-3 calls merged by URL/title overlap
  max_calls: 3
  max_stories: 40               # stories the editor returns per call (digest takes beat.digest_size)
  min_stories: 30               # asked-for minimum (Haiku returned 15-30 when only a maximum was given)
  max_output_tokens: 32000       # Sonnet 5.5 with reasoning: room for reasoning tokens
  prompt: newsroom.editor_v4    # prompt file (app/agents/prompts/); chosen 2026-11-27, docs/smoke/2026-11-27/editor_multiday
  snippet_chars: 160
  merge_title_threshold: 88     # headline similarity that merges stories across calls
  identity_title_threshold: 88  # title similarity that matches a story to a prior one (no shared URL)
  gap_search: false             # arm editor_search: fixed queries through the `search` tool before N2
  gap_max_searches: 4
  gap_max_results: 8
  gap_queries:
    ai: ["most important AI news today", "AI model release announced today",
         "AI policy regulation news today", "AI funding acquisition news today"]
    energy: ["most important energy and power grid news today", "data center power news today",
             "nuclear energy news today", "energy policy news today"]
    physical_ai: ["most important robotics news today", "humanoid robot news today",
                  "autonomous vehicles news today", "physical AI news today"]
  # reuters.com (HTTP 401), axios.com (403) and nikkei.com (login wall, ~380 chars of text) added
  # 2026-11-27 from the e2e run's fetch errors (docs/e2e/2026-11-27/story_notes.json).
  paywalled_domains: [wsj.com, ft.com, bloomberg.com, nytimes.com, theinformation.com, economist.com,
                      barrons.com, washingtonpost.com, businessinsider.com, theatlantic.com, wired.com,
                      reuters.com, axios.com, nikkei.com]
