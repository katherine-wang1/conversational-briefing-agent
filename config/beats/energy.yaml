# Beat: Energy, Grid & Data Centers (live product only in the MVP; not evaluated for importance).
id: energy
name: "Energy, Grid & Data Centers"
scope: >
  The clean-energy transition and the power and infrastructure buildout behind AI: solar, wind,
  storage, nuclear and fusion, grid and transmission, power markets, data center buildout,
  energy policy, climate-tech funding.
out_of_scope: ["oil and gas markets in general (unless tied to power or data centers)", "consumer EV reviews", "general climate science"]
subtopics: [solar-wind, storage-batteries, nuclear-fusion, grid-transmission, power-markets,
            data-center-buildout, energy-policy, climatetech-funding]
digest_size: 25
refresh_live_utc: ["06:00", "18:00"]
