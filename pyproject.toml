[project]
name = "briefing-agent"
version = "0.1.0"
description = "Conversational briefing agent (CS329Z project)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "python-ulid>=2.7",
  "tenacity>=8.5",
]

[project.optional-dependencies]
newsroom = ["feedparser>=6.0", "trafilatura>=1.12", "rapidfuzz>=3.9", "fastembed>=0.3", "numpy>=1.26"]
eval = ["duckdb>=1.0", "pandas>=2.2", "pyarrow>=16", "streamlit>=1.37", "scipy>=1.13"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls real model providers; skipped unless LLM_LIVE_TESTS=1"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
